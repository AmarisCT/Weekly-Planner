  <style>
    :root{
      --ink:#c93d66;
      --ink-strong:#8f2a4a;
      --ink-soft:#d97a98;
      --paper:#fffafa;
      --tint:#fdeef2;
      --drop:rgba(201,61,102,.82);
      --font-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
      --font-body:"Nunito",ui-rounded,system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh;min-height:100dvh;display:grid;place-items:center;
      padding:28px 18px 72px;position:relative;
      color:var(--ink-strong);font-family:var(--font-body);
      background:#f7b3c8;-webkit-font-smoothing:antialiased;
    }
    body::before{
      content:"";position:fixed;inset:-24px;z-index:-2;
      background:url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAAbADADASIAAhEBAxEB/8QAGQAAAgMBAAAAAAAAAAAAAAAAAwQCBQYA/8QALRAAAgIBAwMCBQMFAAAAAAAAAQIDEQQAEiEFMUETURQiI5GxYXGhFTJjgdL/xAAZAQACAwEAAAAAAAAAAAAAAAABAgADBAX/xAAcEQACAgMBAQAAAAAAAAAAAAAAAQIRAxIhMUH/2gAMAwEAAhEDEQA/ANXkzzydXhx48j00MW4gKCSbr28AaJ1DEaWawrbY0oPVjcfxXvqsV83KSPqMjM8CRfUlQKpUA+3mrPbVrD1qCNkjKlBtGw7qdq714P66pi031nZjL6L/AA9C0LqN1lCbIFd70fF6eRLFPMlANVtx8tc2PPfvp8ZOIQZhtLVe0Lzf7eNK9Mkk6h1/bNHuxfRdow9MrH5RfbuLP308nyhsk9Y3RUPirjZ2SsUwH0iNzNyHPII/H+tR6HkSlMkS5RDUrIhUNdk7uf0/givGtx/SsRjZgxzf+JP+dJ9T6aFSJcGOFJTKCdoC2tN3oDVeuvbM8ckXJGY6fizMjyJkCSOlQDeAqkDk8WddgYOJBIr5ELHIR7Z4qIq/H8ca6Pgk8kgmiTepIBCzyxDa7/3EalM1PG36GzpI8mb0nl24sqs3qSIxpvF7fuNBxZcpZAmHlL9IlVmCFA9i+FPbmvtqUDkxc0bHJI7/AL++ozMdxXgjvyAdECxdG3n63HE3qZUZIHBobfzfvpPMzs/IEHx0weGQb0XcEshTzdcc3oUs0kA9aIhZENqwA40IyNN6Usm1ncncSo5tueNF+DLHFdo//9k=") 70% center/cover no-repeat;
      filter:blur(12px) saturate(1.05);
    }
    body::after{
      content:"";position:fixed;inset:0;z-index:-1;
      background:rgba(255,226,235,.38);
    }
    button,input{font:inherit;color:inherit}

    .auth-shell{
      position:relative;width:min(100%,440px);
      background:var(--paper);border:2px solid var(--ink);
      box-shadow:6px 6px 0 var(--drop);
      padding:34px 30px 26px;
    }
    /* washi tape */
    .auth-shell::before{
      content:"";position:absolute;top:-15px;left:50%;width:120px;height:30px;
      transform:translateX(-50%) rotate(-3deg);pointer-events:none;
      background:
        repeating-linear-gradient(-45deg,transparent 0 7px,rgba(255,250,250,.55) 7px 14px),
        rgba(201,61,102,.34);
    }

    .brand{text-align:center}
    .eyebrow{
      margin:0 0 6px;font-family:var(--font-display);font-weight:600;
      font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)
    }
    .eyebrow::before,.eyebrow::after{content:"✦";margin:0 .6em;letter-spacing:0}
    h1{
      margin:0;font-family:var(--font-display);font-weight:700;
      font-size:2.9rem;line-height:1;letter-spacing:.05em;color:var(--ink);
      text-shadow:3px 3px 0 #fbd5df
    }
    .subtitle{margin:10px 0 0;font-weight:700;font-size:.95rem;color:var(--ink-soft)}

    .tabs{display:grid;grid-template-columns:1fr 1fr;margin:24px 0 22px;border:2px solid var(--ink)}
    .tab{
      height:44px;border:0;border-radius:0;background:var(--paper);color:var(--ink);cursor:pointer;
      font-family:var(--font-display);font-weight:600;letter-spacing:.12em;font-size:.86rem
    }
    .tab + .tab{border-left:2px solid var(--ink)}
    .tab:hover{background:var(--tint)}
    .tab.active{background:var(--ink);color:var(--paper)}

    form{display:grid;gap:14px}
    label{
      display:grid;gap:6px;font-family:var(--font-display);font-weight:600;
      font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)
    }
    input{
      height:46px;border:2px solid var(--ink);border-radius:0;
      background:var(--tint);color:var(--ink-strong);padding:0 12px;
      font-family:var(--font-body);font-weight:700;font-size:1rem;letter-spacing:0;text-transform:none
    }
    input:focus{background:var(--paper)}
    .submit{
      height:48px;margin-top:6px;border:2px solid var(--ink);border-radius:0;
      background:var(--ink);color:var(--paper);cursor:pointer;
      box-shadow:3px 3px 0 var(--drop);
      font-family:var(--font-display);font-weight:600;letter-spacing:.14em;font-size:.95rem;
      transition:transform 120ms ease,box-shadow 120ms ease,background 120ms ease
    }
    .submit:hover{background:var(--ink-strong);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--drop)}
    .submit:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--drop)}

    .message{min-height:22px;margin:14px 0 0;font-weight:700;font-size:.9rem;text-align:center;color:var(--ink)}
    .message:empty{min-height:0;margin:0}
    .back{
      display:block;width:max-content;margin:18px auto 0;padding:6px 8px;
      font-family:var(--font-display);font-weight:600;font-size:.82rem;letter-spacing:.12em;
      color:var(--ink);text-decoration:none
    }
    .back:hover{text-decoration:underline;text-underline-offset:4px}
    .hidden{display:none}

    .tab:focus-visible,input:focus-visible,.submit:focus-visible,.back:focus-visible,.studio-mark:focus-visible{
      outline:3px solid var(--ink);outline-offset:3px
    }

    /* amaris ct studio mark: small silver link back to the parent studio */
    .studio-mark{position:fixed;left:14px;bottom:14px;padding:7px 12px 6px;font:400 11px/1 Arial,sans-serif;letter-spacing:2px;text-decoration:none;color:#2b2b2b;background:linear-gradient(110deg,#a8a8a6,#ededeb 70%,#c9c9c7);border:1px solid #9d9d9b;box-shadow:0 2px 8px rgba(60,60,60,.22);text-shadow:0 1px 0 rgba(255,255,255,.6)}
    .studio-mark:hover{background:linear-gradient(110deg,#b8b8b6,#f6f6f4 70%,#d4d4d2);color:#000}

    @media(max-width:480px){
      .auth-shell{padding:30px 20px 22px}
      h1{font-size:2.4rem}
      .studio-mark{left:50%;transform:translateX(-50%);bottom:12px;font-size:10px;letter-spacing:1.5px}
    }
    @media(prefers-reduced-motion:reduce){.submit{transition:none}}
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="brand">
      <p class="eyebrow">weekly planner</p>
      <h1 id="authTitle">LOGIN</h1>
      <p class="subtitle" id="authSubtitle">welcome back to your little room</p>
    </div>

    <div class="tabs" role="group" aria-label="Login or sign up">
      <button class="tab active" id="loginTab" type="button">LOGIN</button>
      <button class="tab" id="signupTab" type="button">SIGN UP</button>
    </div>

    <form id="loginForm">
      <label>
        Email
        <input id="loginEmail" type="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </label>
      <button class="submit" type="submit">LOGIN</button>
    </form>

    <form id="signupForm" class="hidden">
      <label>
        Name
        <input id="signupName" type="text" autocomplete="name" required>
      </label>
      <label>
        Email
        <input id="signupEmail" type="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required>
      </label>
      <button class="submit" type="submit">CREATE ACCOUNT</button>
    </form>

    <p class="message" id="message" aria-live="polite"></p>
    <a class="back" href="index.html">← BACK TO MY ROOM</a>
  </main>

  <a class="studio-mark" href="https://amarisct.github.io/Amaris/">an amaris ct project</a>

  <script src="auth.js?v=20261030-1"></script>
  <script src="pwa.js" defer></script>
</body>
</html>
